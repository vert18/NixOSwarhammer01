[theme]
# Keeps light apps automatically under your dark mode preference
sync_color_scheme = true

[theme.templates]
# Themes all GTK-based applications (Firefox, Discord, etc.)
gtk = true
# Themes all Qt-based applications (Dolphin file manager, etc.)
qt6ct = true
kcolorscheme = true

# Automatically pushes border colors out to your Umbriel compositor windows
umbriel = true
