[general]
mod_key = "Super"
autostart = [ "noctalia" ]
#nvidia_sync_workaround = false
#xwayland = false

[environment]
__EGL_VENDOR_LIBRARY_FILENAMES = "/run/opengl-driver/share/glvnd/egl_vendor.d/50_mesa.json"

[layout]
gap = 24                  

# CORRECTED: Set up dwindle across your whole monitor layout cleanly
[[workspace]]
name = "*"
layout.mode = "dwindle"

[output.DP-1]
mode = "3840x2160@144"
scale = 1.75
hdr = "auto"
vrr = "fullscreen"

[keybinds]
"Mod+Return" = "spawn kitty"
"Mod"   = "spawn noctalia msg panel-toggle launcher"
"Mod+Q" = "window-close"
"Mod+F" = "window-toggle-floating"
"Mod+B" = "spawn brave"
"Mod+E"       = "spawn doublecmd"
"Mod+Shift+E" = "spawn kitty yazi"
"Print"       = "spawn sh -c 'pkill -9 flameshot; QT_QPA_PLATFORM=wayland flameshot gui'"
"Mod+P"       = "spawn sh -c 'pkill -9 flameshot; QT_QPA_PLATFORM=wayland flameshot gui'"

# HARDWARE CONTROLS: Native Volume and Brightness key bindings
"XF86AudioRaiseVolume" = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
"XF86AudioLowerVolume" = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
"XF86AudioMute"        = "spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
"XF86MonBrightnessUp"   = "spawn brightnessctl set 5%+"
"XF86MonBrightnessDown" = "spawn brightnessctl set 5%-"
